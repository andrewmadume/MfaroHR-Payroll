name: Application checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mfaro_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: mfaro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mfaro_ci -d mfaro_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mfaro_ci:ephemeral_ci_only@127.0.0.1:5432/mfaro_ci
      BETTER_AUTH_URL: http://localhost:3000
      APP_MODE: demo
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Generate ephemeral test credentials
        run: node scripts/ci-credentials.mjs
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify authenticated workflows
        shell: bash
        run: |
          npm start > /tmp/mfaro-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3000/ > /dev/null
          RUN_INTEGRATION=1 npm test
      - name: Build the read-only product tour
        run: npm run demo:build
